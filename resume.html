<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Résumé of Ryan Emason, full-stack software engineer." />
  <title>Ryan Emason: Résumé</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,400..700&display=swap" rel="stylesheet">
  <style>
    /* same notebook palette as styles.css: white ruled paper, ink, pen blue, orange */
    :root{
      --paper:#fefefc;--rule:#dce6f0;--margin:#f1b0a8;--ink:#15201d;--muted:#56615c;--line:#e4e7e2;
      --pen:#2a4aa8;--orange:#ef5a35;--acid:#ddff71;
      --sans:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;--serif:'Fraunces',Georgia,serif;
      --shadow:0 1px 2px rgba(21,32,29,.08),0 30px 50px -30px rgba(21,32,29,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0;position:relative;min-height:100vh;color:var(--ink);font:400 13px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
      background-color:var(--paper);
      background-image:linear-gradient(to bottom,transparent 31px,var(--rule) 31px);background-size:100% 32px;
    }
    /* red double margin line, as on the homepage */
    body::before{content:"";position:absolute;top:0;bottom:0;left:56px;width:5px;border-left:1px solid var(--margin);border-right:1px solid var(--margin);pointer-events:none}
    a{color:inherit}

    .toolbar{width:min(210mm,calc(100% - 96px));margin:32px auto 36px;display:flex;justify-content:space-between;align-items:center;gap:16px}
    .back{font:500 13px var(--mono);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
    .back:hover{color:var(--orange)}
    .btn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 20px;border-radius:14px;background:var(--ink);color:#fff;font:600 14px var(--sans);text-decoration:none;box-shadow:0 12px 24px -14px rgba(21,32,29,.8);transition:background .25s ease,transform .3s ease}
    .btn:hover{background:var(--orange);transform:translateY(-2px)}

    /* the résumé is a sheet taped into the notebook */
    .sheet{position:relative;width:min(210mm,calc(100% - 96px));margin:0 auto 72px;background:#fff;border-radius:3px;padding:18mm 17mm;box-shadow:var(--shadow)}
    .tape{position:absolute;z-index:2;top:12px;width:104px;height:28px;background:rgba(221,255,113,.6);box-shadow:0 1px 2px rgba(21,32,29,.08);clip-path:polygon(2% 0,98% 0,100% 22%,97% 42%,100% 62%,97% 82%,99% 100%,1% 100%,3% 78%,0 58%,3% 38%,0 18%)}
    .tape--tl{left:-24px;rotate:-36deg}
    .tape--tr{right:-24px;rotate:36deg;background:rgba(239,90,53,.32)}

    .head{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;padding-bottom:18px;border-bottom:2px solid var(--ink)}
    h1{font:500 42px/1.02 var(--serif);letter-spacing:-.02em;margin:0}
    .role{display:flex;align-items:center;gap:12px;margin:12px 0 0;font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
    .role::before{content:"";flex:none;width:28px;height:2px;border-radius:2px;background:var(--orange)}
    .contact{list-style:none;margin:0;padding:0;text-align:right;font:11px/1.75 var(--mono)}
    .contact a{color:var(--pen);text-decoration:none}
    .contact a:hover{text-decoration:underline}
    .summary{margin:16px 0 0;font-size:13.5px;color:#34403b}

    h2{display:flex;align-items:center;gap:12px;margin:26px 0 4px;font:500 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase}
    h2::before{content:"";flex:none;width:28px;height:2px;border-radius:2px;background:var(--orange)}
    h2::after{content:"";flex:1;height:1px;background:var(--line)}

    .item{padding:11px 0;break-inside:avoid}
    .item+.item{border-top:1px solid var(--line)}
    .row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
    h3{font:500 17px/1.25 var(--serif);letter-spacing:-.01em;margin:0}
    h3 a{text-decoration:none}
    h3 a:hover{color:var(--pen)}
    .meta{font:11px var(--mono);color:var(--muted);white-space:nowrap}
    .sub{font:11px var(--mono);letter-spacing:.02em;color:var(--pen);margin:3px 0 5px}
    .sub a{text-decoration:none}
    .item p{margin:0}
    ul{margin:6px 0 0;padding-left:16px}
    li{margin-bottom:3px}
    li::marker{color:var(--orange)}

    .skills{display:grid;grid-template-columns:130px 1fr;gap:5px 16px;margin:8px 0 0}
    .skills dt{font:500 10.5px/1.75 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .skills dd{margin:0}
    .error{font:12px var(--mono);color:var(--orange)}

    @media screen and (max-width:760px){
      body::before{left:22px}
      .toolbar,.sheet{width:calc(100% - 62px);margin-left:44px;margin-right:18px}
      .sheet{padding:30px 20px}
      .tape{width:84px;height:24px}
      .tape--tl{left:-14px}
      .tape--tr{right:-14px}
      .head{grid-template-columns:1fr;gap:14px}
      h1{font-size:34px}
      .contact{text-align:left}
      .row{display:block}
      .meta{display:block;margin-top:2px}
      .skills{grid-template-columns:1fr;gap:0}
      .skills dd{margin-bottom:8px}
    }

    /* print / PDF: plain white page, same type and colours */
    @page{size:A4;margin:14mm 15mm}
    @media print{
      body{background:#fff;font-size:9.6pt}
      body::before,.toolbar,.tape{display:none}
      .sheet{width:auto;margin:0;padding:0;box-shadow:none;border-radius:0}
      h1{font-size:28pt}
      h3{font-size:12.5pt}
      .summary{font-size:9.8pt}
      h2{break-after:avoid;margin-top:18px}
      .item{padding:8px 0}
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="back" href="./">← ryanemm.tech</a>
    <a data-goatcounter-click="resume-download" class="btn" href="resume.pdf?v=3" download="Ryan-Emason-Resume.pdf">Download PDF <span aria-hidden="true">↓</span></a>
  </div>
  <main class="sheet" id="resume">
    <span class="tape tape--tl" aria-hidden="true"></span>
    <span class="tape tape--tr" aria-hidden="true"></span>
    <div id="resume-body"><p class="error" hidden>Couldn’t load resume.json.</p></div>
  </main>

  <script src="resume.js?v=4"></script>
  <script>
    (() => {
      const { esc, range, host, load } = window.Resume
      const body = document.getElementById('resume-body')
      const link = (text, url) => (url ? `<a href="${esc(url)}">${esc(text)}</a>` : esc(text))
      const tel = (n) => link(n, `tel:${n.replace(/\s/g, '')}`)
      const bullets = (list = []) => (list.length ? `<ul>${list.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : '')

      load()
        .then(({ basics: b = {}, work = [], projects = [], skills = [], education = [], references = [] }) => {
          const loc = b.location ? [b.location.city, b.location.region].filter(Boolean).join(', ') : ''
          const contact = [
            b.email && link(b.email, `mailto:${b.email}`),
            b.phone && tel(b.phone),
            ...(b.otherPhones || []).map(tel),
            b.url && link(b.url.replace(/\/$/, ''), b.url),
            ...(b.profiles || []).map((p) => link(host(p.url), p.url)),
            loc && esc(loc),
          ].filter(Boolean)

          body.innerHTML = `
            <header class="head">
              <div><h1>${esc(b.name)}</h1><p class="role">${esc(b.label)}</p></div>
              <ul class="contact">${contact.map((c) => `<li>${c}</li>`).join('')}</ul>
            </header>
            <p class="summary">${esc(b.summary)}</p>

            <h2>Experience</h2>
            ${work.map((w) => `
              <section class="item">
                <div class="row"><h3>${esc(w.position)}</h3><span class="meta">${esc(range(w.startDate, w.endDate))}</span></div>
                <p class="sub">${[link(w.name, w.url), w.location && esc(w.location)].filter(Boolean).join(' · ')}</p>
                <p>${esc(w.summary)}</p>
                ${bullets(w.highlights)}
              </section>`).join('')}

            <h2>Projects</h2>
            ${projects.map((p) => `
              <section class="item">
                <div class="row"><h3>${link(p.name, p.url)}</h3><span class="meta">${p.url ? esc(host(p.url)) : ''}</span></div>
                <p class="sub">${esc([p.entity, ...(p.roles || [])].filter(Boolean).join(' · '))}</p>
                <p>${esc(p.description)}</p>
                ${bullets(p.highlights)}
              </section>`).join('')}

            <h2>Skills</h2>
            <dl class="skills">${skills.map((s) => `<dt>${esc(s.name)}</dt><dd>${esc((s.keywords || []).join(', '))}</dd>`).join('')}</dl>

            <h2>Education</h2>
            ${education.map((e) => `
              <section class="item">
                <div class="row"><h3>${esc(e.studyType)} ${esc(e.area)}</h3><span class="meta">${esc(range(e.startDate, e.endDate))}</span></div>
                <p class="sub">${esc(e.institution)}${e.location ? ` · ${esc(e.location)}` : ''}</p>
              </section>`).join('')}

            ${references.length ? '<h2>References</h2><p>Available on request.</p>' : ''}`
        })
        .catch(() => {
          body.querySelector('.error').hidden = false
        })
    })()
  </script>
  <!-- visitor stats: https://ryanemm.goatcounter.com (not counted on localhost) -->
  <script data-goatcounter="https://ryanemm.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
