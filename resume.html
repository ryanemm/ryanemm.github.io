<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Résumé — Ryan Emason, full-stack software engineer." />
  <title>Ryan Emason — Résumé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#15201d;--paper:#f4f0e8;--acid:#ddff71;--orange:#fd6a43;--muted:#58635d;--line:#c4c8bc;--mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--serif:'Fraunces',serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5}
    a{color:inherit}
    .toolbar{width:min(210mm,calc(100% - 32px));margin:24px auto 14px;display:flex;justify-content:space-between;align-items:center;gap:16px;font:500 11px var(--mono);letter-spacing:.04em}
    .toolbar a{text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:3px}
    .toolbar .btn{background:var(--ink);color:var(--acid);border:0;padding:12px 15px}
    .toolbar .btn:hover{background:var(--orange);color:var(--ink)}
    .sheet{width:min(210mm,calc(100% - 32px));margin:0 auto 48px;background:#fff;padding:16mm;box-shadow:0 1px 0 rgba(21,32,29,.08),10px 10px 0 rgba(21,32,29,.08)}

    .head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:14px}
    h1{font-size:38px;line-height:.95;letter-spacing:-.06em;font-weight:600;margin:0}
    h1 em{font-family:var(--serif);letter-spacing:-.07em}
    .label{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin:10px 0 0}
    .contact{list-style:none;margin:0;padding:0;text-align:right;font:10px/1.7 var(--mono)}
    .contact a{text-decoration:none}
    .summary{margin:14px 0 0;color:#34403b}

    h2{font:500 10px var(--mono);letter-spacing:.085em;text-transform:uppercase;margin:22px 0 4px;display:flex;gap:8px;align-items:center}
    h2:before{content:'✦';color:var(--orange)}
    h2:after{content:'';flex:1;height:1px;background:var(--line)}

    .item{padding:9px 0;break-inside:avoid}
    .item+.item{border-top:1px solid #e4e5df}
    .row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
    h3{font-size:15px;letter-spacing:-.03em;margin:0}
    h3 a{text-decoration:none}
    .meta{font:10px var(--mono);color:var(--muted);white-space:nowrap}
    .sub{font:10px var(--mono);letter-spacing:.03em;color:var(--muted);margin:2px 0 4px}
    .item p{margin:0}
    ul{margin:5px 0 0;padding-left:15px}
    li{margin-bottom:2px}
    li::marker{color:var(--orange)}

    .skills{display:grid;grid-template-columns:118px 1fr;gap:4px 14px;margin:6px 0 0}
    .skills dt{font:10px/1.7 var(--mono);text-transform:uppercase;letter-spacing:.04em}
    .skills dd{margin:0}
    .error{font:11px var(--mono);color:var(--orange)}

    @media(max-width:640px){
      .sheet{padding:22px 18px}
      .head{grid-template-columns:1fr}
      .contact{text-align:left}
      .row{display:block}
      .meta{display:block}
      .skills{grid-template-columns:1fr}
    }

    @page{size:A4;margin:14mm 15mm}
    @media print{
      body{background:#fff;font-size:10pt}
      .toolbar{display:none}
      .sheet{width:auto;margin:0;padding:0;box-shadow:none}
      h2{break-after:avoid}
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="./">← ryanemm.tech</a>
    <a class="btn" href="resume.pdf" download="Ryan-Emason-Resume.pdf">Download PDF ↓</a>
  </div>
  <main class="sheet" id="resume"><p class="error" hidden>Couldn’t load resume.json.</p></main>

  <script src="resume.js"></script>
  <script>
    (() => {
      const { esc, range, host, load } = window.Resume
      const sheet = document.getElementById('resume')
      const link = (text, url) => (url ? `<a href="${esc(url)}">${esc(text)}</a>` : esc(text))
      const bullets = (list = []) => (list.length ? `<ul>${list.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : '')

      load()
        .then(({ basics: b = {}, work = [], projects = [], skills = [], education = [], references = [] }) => {
          const [first, ...rest] = (b.name || '').split(' ')
          const loc = b.location ? [b.location.city, b.location.region].filter(Boolean).join(', ') : ''
          const contact = [
            b.email && link(b.email, `mailto:${b.email}`),
            b.phone && link(b.phone, `tel:${b.phone.replace(/\s/g, '')}`),
            b.url && link(host(b.url), b.url),
            ...(b.profiles || []).map((p) => link(host(p.url), p.url)),
            loc && esc(loc),
          ].filter(Boolean)

          sheet.innerHTML = `
            <header class="head">
              <div><h1>${esc(first)} <em>${esc(rest.join(' '))}</em></h1><p class="label">${esc(b.label)}</p></div>
              <ul class="contact">${contact.map((c) => `<li>${c}</li>`).join('')}</ul>
            </header>
            <p class="summary">${esc(b.summary)}</p>

            <h2>Experience</h2>
            ${work.map((w) => `
              <section class="item">
                <div class="row"><h3>${esc(w.position)} — ${link(w.name, w.url)}</h3><span class="meta">${esc(range(w.startDate, w.endDate))}</span></div>
                ${w.location ? `<p class="sub">${esc(w.location)}</p>` : ''}
                <p>${esc(w.summary)}</p>
                ${bullets(w.highlights)}
              </section>`).join('')}

            <h2>Projects</h2>
            ${projects.map((p) => `
              <section class="item">
                <div class="row"><h3>${link(p.name, p.url)}</h3><span class="meta">${p.url ? esc(host(p.url)) : ''}</span></div>
                <p class="sub">${esc([p.entity, ...(p.roles || [])].filter(Boolean).join(' · '))}</p>
                <p>${esc(p.description)}</p>
                ${bullets(p.highlights)}
              </section>`).join('')}

            <h2>Skills</h2>
            <dl class="skills">${skills.map((s) => `<dt>${esc(s.name)}</dt><dd>${esc((s.keywords || []).join(', '))}</dd>`).join('')}</dl>

            <h2>Education</h2>
            ${education.map((e) => `
              <section class="item">
                <div class="row"><h3>${esc(e.studyType)} ${esc(e.area)}</h3><span class="meta">${esc(range(e.startDate, e.endDate))}</span></div>
                <p class="sub">${esc(e.institution)}${e.location ? ` · ${esc(e.location)}` : ''}</p>
              </section>`).join('')}

            ${references.length ? '<h2>References</h2><p>Available on request.</p>' : ''}`

          document.title = `${b.name} — Résumé`
        })
        .catch(() => {
          sheet.querySelector('.error').hidden = false
        })
    })()
  </script>
</body>
</html>
